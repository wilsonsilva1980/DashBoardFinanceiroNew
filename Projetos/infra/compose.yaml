name: financeiro
services:
  postgres:
    image: ${POSTGRES_IMAGE:?Load infra/images.env}
    profiles: [postgres]
    environment:
      POSTGRES_DB: financeiro
      POSTGRES_USER: financeiro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["127.0.0.1:${POSTGRES_PORT:-55432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U financeiro -d financeiro"]
      interval: 5s
      timeout: 5s
      retries: 30
  sqlserver:
    image: ${SQLSERVER_IMAGE:?Load infra/images.env}
    profiles: [sqlserver]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD:?Set SQLSERVER_PASSWORD}
    ports: ["127.0.0.1:${SQLSERVER_PORT:-51433}:1433"]
    volumes: [sqlserver-data:/var/opt/mssql]
    healthcheck:
      test: [CMD-SHELL, '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
volumes:
  postgres-data:
  sqlserver-data:
